apiVersion: apps/v1
kind: Deployment
metadata:
  name: xbrl-to-json-frontend-deployment
  labels:
    app: xbrl-to-json-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: xbrl-to-json-frontend
  template:
    metadata:
      labels:
        app: xbrl-to-json-frontend
    spec:
      containers:
        - name: xbrl-to-json-frontend
          image: ghcr.io/open-earth-foundation/xbrl-to-json-converter-client:latest
          imagePullPolicy: Always
          env:
            - name: VITE_API_URL
              value: https://xbrl-to-json-backend.openearth.dev
          resources:
            requests:
              memory: "250Mi"
              cpu: "125m"
            limits:
              memory: "512Mi"
              cpu: "250m"
          ports:
            - containerPort: 5173
